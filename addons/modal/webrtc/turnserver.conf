#
# The fixed part of a Modal session's TURN relay; `turnserver.sh` adds what is
# known only once the Sandbox runs (its secret, its address, its ports) and
# hands coturn the two together.
#
# A browser outside Modal reaches the relay over TCP alone, through a raw port
# Modal exposes (`unencrypted_ports`), and the relay sends what it carries over
# UDP to the session's WebRTC peer, inside the same Sandbox. Everything else a
# TURN server offers is turned off: Modal forwards no UDP, so a UDP listener
# serves nobody; there is no certificate for TLS or DTLS; and no TCP relay
# (RFC 6062) is needed between two ends that both speak UDP.

no-udp
no-tls
no-dtls
no-tcp-relay

# Credentials are those of the TURN REST scheme: a user name that carries its
# own expiry, and a password that is the user name signed with the session's
# secret (`turn-credentials.sh`). Nothing but the secret is stored.
use-auth-secret
fingerprint
realm=selkies-modal

# Not an open relay: no peer anywhere is allowed but the Sandbox's own
# addresses, which `turnserver.sh` lists as the exceptions. The address of
# every allocation is checked against these lists, so a credential that leaked
# relays to nothing outside the session.
denied-peer-ip=0.0.0.0-255.255.255.255
denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
no-multicast-peers

# A session has one user, with a viewer or two: a handful of allocations is
# all it takes, and the bound keeps a leaked credential from tying up the
# relay's ports.
user-quota=8
total-quota=32

no-cli
log-file=stdout
simple-log
