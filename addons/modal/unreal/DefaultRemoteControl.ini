;
; The Remote Control API settings Send to Unreal needs, for the Config folder
; of the Unreal project the session opens (URemoteControlSettings reads the
; RemoteControl config, not Engine). The web server starts with the editor on
; 30010, and remote Python is allowed for one class, the Python script library,
; whose ExecutePythonCommandEx the Blender add-on calls (send_to_unreal.py).
; The server has no authentication, so nothing outside the Sandbox may reach
; the port: no tunnel or exposed port names it. Console commands over the API
; stay off.
[/Script/RemoteControlCommon.RemoteControlSettings]
bAutoStartWebServer=True
RemoteControlHttpServerPort=30010
bEnableRemotePythonExecution=True
bAllowAnyRemoteFunctionCall=False
+CustomAllowedRemoteFunctionCalls=(ClassPath="/Script/PythonScriptPlugin.PythonScriptLibrary")
bAllowConsoleCommandRemoteExecution=False
