<!-- The signed-in studio, served at /app/: the projects a person and the agent make together. The
     brand token is filled from the catalog at build time (vite.config.ts). -->

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Studio — %BRAND%</title>
    <meta name="description" content="Make creative projects with an agent that opens creative engines on cloud GPUs and streams them to you." />
    <!-- An account page has nothing for a search engine. -->
    <meta name="robots" content="noindex" />

    <meta name="color-scheme" content="dark" />

    <!-- Shown while the entry script checks who is signed in. -->
    <div id="root">

        <span class="spinner size-6"></span>
      </div>
    </div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif; color: #f5f5f8; background: #05050a">
