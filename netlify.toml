# Netlify builds the Moody site (moody/web) from this file alone: connecting the repository needs no
# setting in the dashboard. The Supabase project and the control plane's address are the site's
# environment variables (VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, VITE_MOODY_API_URL); the site
# builds and renders in full without them, with sign-up shown as opening soon.

[build]
  base = "moody/web"
  command = "npm run build"
  # Relative to the base directory.
  publish = "dist"
  # The repository is mostly not this site, so a push that touches none of the site, the catalog it
  # reads, or this file is not rebuilt. Exit status 0 skips the build; the comparison only yields it
  # when both commits are known and differ, so a first build, or one whose previous commit is not in
  # the clone, always runs.
  ignore = '[ -n "$CACHED_COMMIT_REF" ] && [ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- . ../catalog.json ../../netlify.toml'

[build.environment]
  NODE_VERSION = "22"

# Both pages are files (dist/index.html and dist/app/index.html), so / and /app/ are real paths and
# need no rewrite; any other path is a 404.

[[headers]]
  for = "/*"
  [headers.values]
    # Scripts and styles come from the site itself. Styles also allow inline, for the style
    # attributes that carry each app's accent color. Connections are open to any HTTPS origin
    # because the Supabase project and the control plane are named by the build's environment,
    # which this file cannot read. So are pictures, sound, and video, which are the library's files
    # at the Supabase project's storage, and frames, which are the engines' screens at addresses the
    # control plane hands out for each session: with either held to the site itself, a project shows
    # none of its media and no engine. Pictures and media also come from `blob:`, which is how a
    # 3D model's own textures are read.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self'; connect-src 'self' https:; frame-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    # This host only: a site moved to a domain of its own decides for that domain's other hosts itself
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# Vite names every file under assets/ after a hash of its content, so one can be cached for good.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Art and logos keep their names when they change, so they are cached for a day and revalidated.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
